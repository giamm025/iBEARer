openapi: 3.0.3

info:
  title: BEAR API (Browser Extension for Academic Research)
  description: API RESTful per la gestione di audit studies, configurazione di esperimenti e raccolta telemetria.
  version: 1.0.1

servers:
  - url: "http://localhost:8000"

tags:
  - name: Login
    description: Endpoint for researcher login and registration.

  - name: Config
    description: Endpoints for managing experiment configurations.

  - name: Participants
    description: Operations related to managing A/B testing participants.

  - name: Experiments
    description: Endpoints for creating, retrieving, updating, and deleting experiments.

  - name: Telemetry
    description: Endpoints for submitting and retrieving telemetry data from participants.

  - name: Admin
    description: Administrative endpoints for managing the platform and monitoring experiments.

  - name: Extension
    description: Endpoints used by the browser extension for enrollment, configuration fetching, and telemetry submission.

  - name: Webhook
    description: Endpoint for receiving webhook calls from Google Forms to update participant status.


components:

  securitySchemes:
    # 1) AdminBearerAuth: per autenticare i ricercatori tramite dashboard (JWT)
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT per l'autenticazione dei ricercatori (Dashboard)."
    
    # 2) WebhookSecret: per autenticare le richieste provenienti da Google Forms (API Key segreta condivisa)  
    WebhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
      description: "API Key segreta condivisa con Google Forms per l'aggiornamento sicuro dello stato."
    # Quando scriveremo lo script di Google Form dobbiamo ricordarci di aggiungere questa chiave segereta nell'header
    # cosi che il backend sia sicuro che l'aggiornamento dello stato sia stato fatto da Google Form e non da un qualcun altro.


  schemas:

    UUID:
      description: A universally unique identifier.
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"
    
    ResearcherId:
      $ref: "#/components/schemas/UUID"

    ParticipantId:
      $ref: "#/components/schemas/UUID"
    
    ExperimentId:
      $ref: "#/components/schemas/UUID"
    
    Link:
      type: string
      format: uri
      example: "https://docs.google.com/forms/...?uuid=123e4567..."

    Group:
      description: The assigned A/B testing group.
      type: string
      enum: [CONTROL, TREATMENT, UNASSIGNED]

    ParticipantStatus:
      description: The current phase of the participant in the experiment flow.
      type: string
      enum: [ENROLLED, PRE-SURVEY-NOT-COMPLETED, PRE-SURVEY-COMPLETED, EXPERIMENT, POST-SURVEY-NOT-COMPLETED, POST-SURVEY-COMPLETED, COMPLETED, GAVE_UP]

    Participant:
      description: Representation of a study participant.
      required: [participantId, status, group]
      properties:
        participantId:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/ParticipantStatus"
        group:
          $ref: "#/components/schemas/Group"

    EnrollmentResponse:
      description: Data returned to the extension upon successful registration.
      required: [participantId, preSurveyLink]
      properties:
        participantId:
          $ref: "#/components/schemas/UUID"
        preSurveyLink:
          $ref: "#/components/schemas/Link"

    StatusUpdatePayload:
      description: Webhook payload from Google Forms.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ParticipantStatus"

    StatusResponse:
      description: Polling response for the extension.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ParticipantStatus"
        group:
          $ref: "#/components/schemas/Group"

    TelemetryEvent:
      description: A single interaction record.
      required: [event_fqn, timestamp]
      properties:
        event_fqn:
          type: string
          description: FQN of the event.
          example: "telemetry.events.ClickOnLinkEvent"
        timestamp:
          type: string
          format: date-time
        metadata:
          description: Contextual data (e.g., CSS selector, URL, scroll depth).
          additionalProperties: true

    TelemetryBatch:
      description: A batch of telemetry events.
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryEvent"
    
    Error:
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    # ----------------------------------------------------------
    # CONFIG.JSON (Mirroring)
    # ----------------------------------------------------------

    # ------------------------------------ Configurazione lato BACKEND (Ricercatore) ------------------------------------

    # inviata dal RICERCATORE tramite PUT /admin/config contiene TUTTI i campi permettendo al ricercatore di specificare 
    # i gruppi e quali interventi/triggers si applicano a ciascun gruppo

    Config:
      description: The raw, unfiltered rules engine configuration uploaded by the researcher.
      required: [experiment, telemetry_settings, target, triggers, interventions]
      properties:
        experiment:
          $ref: '#/components/schemas/ExperimentSettings'
        telemetry_settings:
          $ref: '#/components/schemas/TelemetrySettings'
        target:
          $ref: '#/components/schemas/TargetSettings'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/Intervention'

    Trigger:
      description: A trigger containing mapping logic for multiple A/B groups.
      required: [id, target_groups, event_source, logical_operator, conditions, apply_interventions]
      properties:
        id:
          type: string
          example: "trigger_contains_conspiracy"
        target_groups:
          description: "List of groups this trigger applies to."
          type: array
          items:
            type: string
          example: ["TREATMENT_A", "TREATMENT_AGGRESSIVE"]
        event_source:
          type: string
        logical_operator:
          type: string
          enum: [AND, OR]
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        apply_interventions:
          description: "Maps intervention IDs to the specific groups that should receive them."
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            apply_red_border: ["TREATMENT_A", "TREATMENT_AGGRESSIVE"]
            inject_debunking: ["TREATMENT_AGGRESSIVE"]


    # ------------------------------------ FILTERED CONFIG (Partecipante) ------------------------------------
    
    # inviata su richiesta all'ESTENSIONE tramite GET /participant/{participant_id}/config contiene SOLO  alcuni campi.
    # in particolare è stata filtrata per includere SOLO i trigger e interventi rilevanti per il gruppo del partecipante

    FilteredConfig:
      description: The filtered configuration delivered to the browser extension (contains no group mappings).
      required: [experiment, telemetry_settings, target, triggers, interventions]
      properties:
        experiment:
          $ref: '#/components/schemas/ExperimentSettings'
        telemetry_settings:
          $ref: '#/components/schemas/TelemetrySettings'
        target:
          $ref: '#/components/schemas/TargetSettings'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/FilteredTrigger'
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/Intervention'

    FilteredTrigger:
      description: A flat trigger ready to be executed by the extension.
      required: [id, event_source, logical_operator, conditions, apply_interventions]
      properties:
        id:
          type: string
        event_source:
          type: string
        logical_operator:
          type: string
          enum: [AND, OR]
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        apply_interventions:
          description: "A simple list of intervention IDs to execute."
          type: array
          items:
            type: string
          example: ["apply_red_border", "inject_debunking"]


    # ------------------------------------ COMPONENTI CONDIVISI ------------------------------------
    ExperimentSettings:
      required: [experiment_name, experiment_duration_minutes]
      properties:
        experiment_name:
          type: string
        experiment_duration_minutes:
          type: integer
        groups:
          type: array
          items:
            type: string
          example: ["CONTROL", "TREATMENT1", "TREATMENT2"]
          
    TelemetrySettings:
      properties:
        track_events:
          type: array
          items:
            type: string
        sync_interval_ms:
          type: integer
          
    TargetSettings:
      properties:
        url_pattern:
          type: string
        dependency:
          type: string

    Condition:
      required: [property, operator, value]
      properties:

        property:
          type: string
          description: "The property to evaluate (e.g., search_query, post_title)"
          example: "search_query"

        operator:
          type: string
          enum: [CONTAINS_ANY, NOT_CONTAINS_ANY, EQUALS]
          example: "CONTAINS_ANY"

        value:
          description: "The value(s) to compare against the property."
          type: array
          items:
            type: string
          example: ["epstein", "vaccini", "terra piatta", "5g"]

    Intervention:
      required: [id, function_fqn, payload]
      properties:

        id:
          description: "A unique string identifier for the intervention, used for mapping in triggers."
          type: string
          example: "apply_red_border"

        function_fqn:
          description: "The Fully Qualified Name of the intervention function."
          type: string
          example: "interventions.debug.applyBorder"

        payload:
          description: "The payload to pass to the intervention function."
          additionalProperties: true
          example:
            border_style: "30px solid red"

  # ---------------------------------------------------------
  # Custom Errors
  # ---------------------------------------------------------
  responses:

    Error400:
      description: "Bad Request. Invalid input."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"

    Error401:
      description: "Unauthorized. Authentication token is missing or invalid."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error" 

    Error403:
      description: "Forbidden. The user is authenticated but does not have the necessary permissions to perform this specific action (e.g., delete a message that is not theirs)."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"

    Error404:
      description: "Not Found. The requested resource does not exist."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"
    
    Error405:
      description: "Method Not Allowed. The HTTP method is not supported for this endpoint."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"

    Error409:
      description: "Conflict. The request conflicts with the current state."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"
    
    Error500:
      description: "Internal Server Error. An unexpected error occurred on the server."
      content:
        application/json:
          schema: 
            $ref: "#/components/schemas/Error"


  # ---------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------
  parameters:

    ResearcherId:
      name: researcherId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResearcherId"

    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ExperimentId"
    
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ParticipantId"


# ---------------------------------------------------------
# Endpoints
# ---------------------------------------------------------
paths:

  # =========================================
  # PUBLIC ENDPOINTS
  # =========================================
  /participants/{participantId}/config:

    parameters:
      - $ref: '#/components/parameters/ParticipantId'

    get:
      tags: [Extension, Config]
      operationId: getConfig
      summary: Download experiment configuration
      description: Retrieves the filtered configuration for the specified participant. ("Filtered" means that the configuration contains only the triggers and interventions relevant for the participant's assigned group)

      responses:
        '200':
          description: Configuration JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredConfig'
        '405':
          $ref: '#/components/responses/Error405'


  /participants/:

    post:
      tags: [Extension, Participants]
      operationId: enrollParticipant
      summary: Create Participant (Enrollment)
      description: Generates a new UUID and a deep link for the pre-survey.

      responses:
        '201':
          description: Participant enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '405':
          $ref: '#/components/responses/Error405'

  /participants/{participantId}/status/:
    parameters:
      - $ref: '#/components/parameters/ParticipantId'
          
    get:
      tags: [Extension, Participants]
      operationId: getParticipantStatus
      summary: Polling for Survey Status
      description: Extension polls this endpoint to know when to start/stop the experiment.

      responses:
        '200':
          description: Current status and group assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'
          
    put:
      tags: [Webhook]
      operationId: updateParticipantStatus
      summary: Update Participant Status (Google Forms)
      description: Webhook triggered by Google Forms upon survey completion.

      security:
        - WebhookSecret: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdatePayload'

      responses:
        '200':
          description: Status successfully updated.
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'


  /participants/{participantId}/telemetry/:

    post:
      tags: [Extension, Telemetry]
      operationId: sendTelemetry
      summary: Submit Telemetry Batch
      description: Extension sends batched interaction data.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'

      responses:
        '201':
          description: Batch saved successfully.
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'


  # ==========================================
  # ADMIN / RESEARCHER ENDPOINTS
  # ==========================================
  /admin/login/:

    post:
      tags: [Admin, Login]
      operationId: researcherLogin
      summary: Researcher Login

      requestBody:
        required: true
        content:
          application/json:
            schema:

              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string

      responses:
        '200':
          description: Returns JWT Token.
          content:
            application/json:
              schema:
                properties:
                  token:
                    type: string
        '405':
          $ref: '#/components/responses/Error405'


  /admin/config/:

    get:
      tags: [Admin, Config]
      operationId: getMasterConfig
      summary: Get Full Experiment Configuration
      description: Retrieves the unfiltered Master Configuration for the researcher dashboard.

      security:
        - AdminBearerAuth: []

      responses:
        '200':
          description: The full Master Config JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config' 
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'

    put:
      tags: [Admin, Config]
      operationId: updateConfig
      summary: Update Experiment Configuration

      security:
        - AdminBearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'

      responses:
        '204':
          description: Config saved. Nothing returned.
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'


  /admin/participants/:

    get:
      tags: [Admin, Participants]
      operationId: listParticipants
      summary: List all Participants

      security:
        - AdminBearerAuth: []

      responses:
        '200':
          description: Array of participants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Error401'
        '405':
          $ref: '#/components/responses/Error405'